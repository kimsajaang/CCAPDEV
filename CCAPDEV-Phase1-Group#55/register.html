<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Backlog Hero | Register</title>
	<!-- Bootstrap framework -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Custom theme -->
	<link href="assets/css/theme.css" rel="stylesheet">
	<!-- Page-specific styles for registration form -->
	<style>
		.auth-wrapper {
			min-height: calc(100vh - 72px);
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.auth-card {
			background: linear-gradient(145deg, rgba(28, 37, 46, 0.9), rgba(16, 22, 27, 0.95));
			border: 1px solid var(--border-subtle);
			box-shadow: var(--shadow-soft);
			border-radius: 18px;
		}
		.strength-bar {
			height: 6px;
			border-radius: 999px;
			background: var(--border-subtle);
			overflow: hidden;
		}
		.strength-fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #ff6b6b, #ffd166, #50d6b4, #5383e8);
			transition: width 0.25s ease;
		}
		.navbar {
			background-color: #1c252e !important;
			border-bottom: 1px solid #2a3843;
		}
		.navbar-brand {
			font-weight: 700;
			letter-spacing: 0.02em;
		}
		.navbar-nav .nav-link {
			color: #9e9e9e !important;
			transition: color 0.2s ease;
			padding: 0.5rem 1rem !important;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.06em;
		}
		.navbar-nav .nav-link:hover {
			color: #ffffff !important;
		}
		.navbar-nav .nav-link.active {
			color: #5383e8 !important;
		}
		.nav-status-pill {
			display: inline-block;
			padding: 4px 14px;
			border-radius: 50px;
			font-weight: 700;
			font-size: 0.75rem;
			color: #1c252e;
			background: linear-gradient(90deg, #50d6b4, #5383e8);
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
		<div class="container py-2">
			<a class="navbar-brand fw-bold" href="index.html">🛡️ Backlog Hero</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto text-uppercase small fw-bold">
					<li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
					<li class="nav-item"><a class="nav-link" href="library.html">My Library</a></li>
					<li class="nav-item"><a class="nav-link" href="search.html">Search Games</a></li>
					<li class="nav-item"><a class="nav-link" href="stats.html">Community</a></li>
					<li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
					<li class="nav-item"><span class="nav-status-pill ms-lg-2">Online</span></li>
					<li class="nav-item"><a class="nav-link btn btn-outline-primary ms-lg-2 px-3 py-1" href="login.html">Login</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="auth-wrapper">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-8 col-lg-6">
					<div class="auth-card p-4 p-md-5">
						<div class="d-flex align-items-start justify-content-between mb-4">
							<div>
								<p class="text-uppercase text-muted small mb-1">Create your space</p>
								<h3 class="fw-bold mb-1">Join Backlog Hero</h3>
								<p class="text-muted small mb-0">Track, prioritize, and finish your games.</p>
							</div>
							<span class="badge badge-accent rounded-pill px-3 py-2">Free</span>
						</div>

						<form>
							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label">Display Name</label>
									<input type="text" class="form-control" placeholder="Artemis" required>
								</div>
								<div class="col-md-6">
									<label class="form-label">Email</label>
									<input type="email" class="form-control" placeholder="you@example.com" required>
								</div>
								<div class="col-md-6">
									<label class="form-label">Password</label>
									<input id="password" type="password" class="form-control" placeholder="Create a strong password" required>
									<div class="strength-bar mt-2"><div id="strengthFill" class="strength-fill"></div></div>
									<small class="text-muted">Use 10+ characters with numbers and symbols.</small>
								</div>
								<div class="col-md-6">
									<label class="form-label">Confirm Password</label>
									<input id="confirm" type="password" class="form-control" placeholder="Repeat password" required>
								</div>
								<div class="col-md-6">
									<label class="form-label">Primary Platform</label>
									<select class="form-select">
										<option selected>PC</option>
										<option>PlayStation</option>
										<option>Xbox</option>
										<option>Nintendo</option>
										<option>Mobile</option>
									</select>
								</div>
								<div class="col-md-6">
									<label class="form-label">Region</label>
									<select class="form-select">
										<option selected>North America</option>
										<option>Europe</option>
										<option>Asia</option>
										<option>South America</option>
										<option>Australia</option>
										<option>Africa</option>
									</select>
								</div>
							</div>

							<div class="form-check mt-4 mb-3">
								<input class="form-check-input" type="checkbox" value="" id="terms" required>
								<label class="form-check-label text-muted" for="terms">I agree to the Backlog Hero terms and privacy.</label>
							</div>

							<div class="d-grid mb-3">
								<button type="submit" class="btn btn-primary py-2">Create Account</button>
							</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Password validation and strength meter script -->
	<script>
		// Get references to form elements
		const passwordInput = document.getElementById('password');
		const confirmInput = document.getElementById('confirm');
		const strengthFill = document.getElementById('strengthFill');

		// Function to calculate password strength based on criteria
		function updateStrength(value) {
			let score = 0;  // Start with 0 points
			// Each criterion adds 25% to the strength bar
			if (value.length >= 10) score += 25;        // Length check
			if (/[A-Z]/.test(value)) score += 25;       // Uppercase letter check
			if (/[0-9]/.test(value)) score += 25;       // Number check
			if (/[^A-Za-z0-9]/.test(value)) score += 25; // Special character check
			// Update the visual strength bar width
			strengthFill.style.width = `${score}%`;
		}

		// Listen for password input and update strength meter in real-time
		if (passwordInput) {
			passwordInput.addEventListener('input', (e) => updateStrength(e.target.value));
		}

		// Password confirmation validation
		if (confirmInput && passwordInput) {
			confirmInput.addEventListener('input', () => {
				// Check if both passwords match
				const match = confirmInput.value === passwordInput.value;
				// Add Bootstrap validation classes for visual feedback
				confirmInput.classList.toggle('is-valid', match && confirmInput.value.length > 0);
				confirmInput.classList.toggle('is-invalid', !match && confirmInput.value.length > 0);
			});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
