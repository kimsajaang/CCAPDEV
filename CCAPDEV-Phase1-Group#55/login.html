<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Backlog Hero | Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			min-height: 100vh;
			background: radial-gradient(circle at 20% 20%, rgba(83, 131, 232, 0.18), transparent 25%),
						radial-gradient(circle at 80% 0%, rgba(80, 214, 180, 0.14), transparent 22%),
						#0f1519;
			color: #ffffff;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		.navbar {
			background-color: rgba(28, 37, 46, 0.9) !important;
			border-bottom: 1px solid #2a3843;
			backdrop-filter: blur(10px);
		}
		.auth-wrapper {
			min-height: calc(100vh - 72px);
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.auth-card {
			background: linear-gradient(145deg, rgba(28, 37, 46, 0.9), rgba(16, 22, 27, 0.95));
			border: 1px solid #2a3843;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
			border-radius: 18px;
		}
		.form-control, .form-select {
			background-color: #10171d !important;
			border: 1px solid #2a3843;
			color: #ffffff;
		}
		.form-control:focus {
			box-shadow: 0 0 0 0.15rem rgba(83, 131, 232, 0.35);
			border-color: #5383e8;
		}
		.btn-primary {
			background-color: #5383e8 !important;
			border-color: #5383e8 !important;
		}
		.btn-primary:hover {
			background-color: #3d6ad2 !important;
			border-color: #3d6ad2 !important;
		}
		.text-muted { color: #9e9e9e !important; }
		.link-accent { color: #7cb7ff; text-decoration: none; }
		.link-accent:hover { color: #a8ccff; }
		.badge-accent {
			background: linear-gradient(120deg, #50d6b4, #5383e8);
			color: #0d1217;
		}
		.provider-btn img {
			width: 24px;
			height: 24px;
		}
		.provider-btn span {
			flex: 1;
			text-align: center;
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
		<div class="container py-2">
			<a class="navbar-brand fw-bold" href="index.html">🛡️ Backlog Hero</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
					<li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
					<li class="nav-item"><a class="nav-link" href="library.html">My Library</a></li>
					<li class="nav-item"><a class="nav-link" href="search.html">Search Games</a></li>
					<li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
					<li class="nav-item"><span class="badge badge-accent ms-lg-2">Log In</span></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="auth-wrapper">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-7 col-lg-5">
					<div class="auth-card p-4 p-md-5">
						<div class="d-flex align-items-start justify-content-between mb-4">
							<div>
								<p class="text-uppercase text-muted small mb-1">Welcome back</p>
								<h3 class="fw-bold mb-1">Log in to your backlog</h3>
								<p class="text-muted small mb-0">Stay on top of your gaming goals.</p>
							</div>
							<span class="badge badge-accent rounded-pill px-3 py-2">Secure</span>
						</div>

						<form>
							<div class="mb-3">
								<label class="form-label">Email or Username</label>
								<input type="text" class="form-control" placeholder="you@example.com" required>
							</div>
							<div class="mb-3">
								<div class="d-flex justify-content-between align-items-center">
									<label class="form-label mb-0">Password</label>
									<a href="#" class="link-accent small">Forgot?</a>
								</div>
								<div class="input-group">
									<input id="password" type="password" class="form-control" placeholder="••••••••" required>
									<button class="btn btn-outline-secondary text-white" type="button" id="togglePassword">Show</button>
								</div>
							</div>
							<div class="d-flex align-items-center justify-content-between mb-4">
								<div class="form-check">
									<input class="form-check-input" type="checkbox" value="" id="remember">
									<label class="form-check-label text-muted" for="remember">Keep me signed in</label>
								</div>
								<span class="text-muted small">2FA ready</span>
							</div>
							<div class="d-grid mb-3">
								<button type="submit" class="btn btn-primary py-2">Log In</button>
							</div>
							<div class="d-grid mb-3">
								<button type="button" class="btn btn-outline-light border-secondary py-2 provider-btn d-flex align-items-center gap-2">
									<img src="assets/logos/steam-logo.png" alt="Steam logo">
									<span>Continue with Steam</span>
								</button>
								<button type="button" class="btn btn-outline-light border-secondary py-2 provider-btn d-flex align-items-center gap-2 mt-2">
									<img src="assets/logos/epic.png" alt="Epic Games logo">
									<span>Continue with Epic Games</span>
								</button>
								<button type="button" class="btn btn-outline-light border-secondary py-2 provider-btn d-flex align-items-center gap-2 mt-2">
									<img src="assets/logos/riot.png" alt="Riot logo">
									<span>Continue with Riot</span>
								</button>
								<button type="button" class="btn btn-outline-light border-secondary py-2 provider-btn d-flex align-items-center gap-2 mt-2">
									<img src="assets/logos/google.svg" alt="Google logo">
									<span>Continue with Google</span>
								</button>
								<button type="button" class="btn btn-outline-light border-secondary py-2 provider-btn d-flex align-items-center gap-2 mt-2">
									<img src="assets/logos/apple.svg" alt="Apple logo">
									<span>Continue with Apple</span>
								</button>
							</div>
							<p class="text-center text-muted small mb-0">Steam icons created by <a class="link-accent" href="https://www.flaticon.com/free-icons/steam" title="steam icons">Freepik - Flaticon</a>.</p>
						</form>

						<p class="text-center text-muted mb-0">New to Backlog Hero? <a class="link-accent" href="register.html">Create an account</a></p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		const togglePassword = document.getElementById('togglePassword');
		const passwordInput = document.getElementById('password');
		if (togglePassword && passwordInput) {
			togglePassword.addEventListener('click', () => {
				const isHidden = passwordInput.type === 'password';
				passwordInput.type = isHidden ? 'text' : 'password';
				togglePassword.textContent = isHidden ? 'Hide' : 'Show';
			});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
