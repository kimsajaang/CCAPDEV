<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Games | Backlog Hero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Reusing your OP.GG Theme colors */
        body { background-color: #0f1519; color: #ffffff; }
        .navbar { background-color: #1c252e; border-bottom: 1px solid #2a3843; }
        .card { background-color: #1c252e; border: 1px solid #2a3843; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #5383e8; }
        .btn-primary { background-color: #5383e8; border: none; }
        .search-container { background: #1c252e; padding: 40px 0; border-bottom: 1px solid #2a3843; }
        .game-cover { height: 250px; object-fit: cover; }
        .text-muted { color: #9e9e9e !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🛡️ Backlog Hero</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Dashboard</a>
                <a class="nav-link" href="library.html">My Library</a>
                <a class="nav-link active" href="search.html">Search Games</a>
                <a class="nav-link" href="profile.html">Profile</a>
            </div>
        </div>
    </nav>

    <header class="search-container text-center">
        <div class="container">
            <h2 class="mb-4">Find your next adventure</h2>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="input-group input-group-lg">
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Search 400,000+ games...">
                        <button class="btn btn-primary px-4" type="button">Search</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <h4 class="mb-4 text-muted">Trending Results</h4>
        <div class="row row-cols-1 row-cols-md-5 g-4">
            
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co848r.webp" class="card-img-top game-cover" alt="Elden Ring">
                    <div class="card-body">
                        <h6 class="card-title">Elden Ring</h6>
                        <p class="card-text small text-muted">Action RPG • 2022</p>
                        <button class="btn btn-sm btn-outline-primary w-100">+ Add to Library</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co496f.webp" class="card-img-top game-cover" alt="Hades II">
                    <div class="card-body">
                        <h6 class="card-title">Hades II</h6>
                        <p class="card-text small text-muted">Roguelike • 2024</p>
                        <button class="btn btn-sm btn-outline-primary w-100">+ Add to Library</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1r77.webp" class="card-img-top game-cover" alt="The Witcher 3">
                    <div class="card-body">
                        <h6 class="card-title">The Witcher 3</h6>
                        <p class="card-text small text-muted">Open World • 2015</p>
                        <button class="btn btn-sm btn-outline-primary w-100">+ Add to Library</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co5v78.webp" class="card-img-top game-cover" alt="Baldur's Gate 3">
                    <div class="card-body">
                        <h6 class="card-title">Baldur's Gate 3</h6>
                        <p class="card-text small text-muted">Tactical RPG • 2023</p>
                        <button class="btn btn-sm btn-outline-primary w-100">+ Add to Library</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co2mdf.webp" class="card-img-top game-cover" alt="Cyberpunk 2077">
                    <div class="card-body">
                        <h6 class="card-title">Cyberpunk 2077</h6>
                        <p class="card-text small text-muted">Sci-Fi • 2020</p>
                        <button class="btn btn-sm btn-outline-primary w-100">+ Add to Library</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
