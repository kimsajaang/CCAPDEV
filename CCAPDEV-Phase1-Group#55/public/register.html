<!-- register.html — Account registration page for Backlog Hero.
     Form is kept short — just the essentials for signing up.
     The password strength meter uses a simple scoring system. -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Backlog Hero | Register</title>
	<!-- Bootstrap framework -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Page-specific styles for registration form -->
	<style>
		html { overflow-y: scroll; }
		/* Registration page styles — matches login page dark theme.
		   Both auth pages share the same radial gradient bg and card style */
		body {
			min-height: 100vh;
			background: radial-gradient(circle at 20% 20%, rgba(83, 131, 232, 0.18), transparent 25%),
						radial-gradient(circle at 80% 0%, rgba(80, 214, 180, 0.14), transparent 22%),
						#0f1519;
			color: #ffffff;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		.auth-wrapper {
			min-height: calc(100vh - 72px);
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.auth-card {
			background: linear-gradient(145deg, rgba(28, 37, 46, 0.9), rgba(16, 22, 27, 0.95));
			border-radius: 18px;
			border: 1px solid #2a3843;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
		}
		.form-control, .form-select {
			background-color: #10171d !important;
			border: 1px solid #2a3843;
			color: #ffffff;
		}
		.form-control::placeholder {
			color: #6f7d8a;
		}
		.form-control:focus, .form-select:focus {
			box-shadow: 0 0 0 0.15rem rgba(83, 131, 232, 0.35);
			border-color: #5383e8;
			color: #ffffff;
			background-color: #10171d;
		}
		.form-control,
		.form-control:focus,
		.form-control:active {
			color: #ffffff !important;
		}
		.form-select {
			color: #ffffff !important;
		}
		.form-label {
			color: #cbd5df;
		}
		.btn-primary {
			background-color: #5383e8 !important;
			border-color: #5383e8 !important;
		}
		.btn-primary:hover {
			background-color: #3d6ad2 !important;
			border-color: #3d6ad2 !important;
		}
		.btn-outline-primary {
			color: #5383e8 !important;
			border-color: #5383e8 !important;
			transition: all 0.2s ease;
		}
		.btn-outline-primary:hover {
			background-color: #5383e8 !important;
			color: #ffffff !important;
		}
		.text-muted { color: #9e9e9e !important; }
		.link-accent { color: #7cb7ff; text-decoration: none; }
		.link-accent:hover { color: #a8ccff; }
		.badge-accent {
			background: linear-gradient(120deg, #50d6b4, #5383e8);
			color: #0d1217;
		}
		/* Password strength meter — gradient bar that fills based on password quality.
		   Goes from red (weak) → yellow → green → blue (strong).
		   999px border-radius makes it fully rounded like a progress pill */
		.strength-bar {
			height: 6px;
			border-radius: 999px;
			background: #2a3843;
			overflow: hidden;
		}
		.strength-fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #ff6b6b, #ffd166, #50d6b4, #5383e8);
			transition: width 0.25s ease;
		}
		.navbar {
			background-color: rgba(28, 37, 46, 0.9) !important;
			border-bottom: 1px solid #2a3843;
			backdrop-filter: blur(10px);
		}
		.navbar-brand {
			font-weight: 700;
			letter-spacing: 0.02em;
		}
		.navbar-nav .nav-link {
			color: #9e9e9e !important;
			transition: color 0.2s ease, transform 0.2s ease;
			padding: 0.5rem 1rem !important;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.06em;
		}
		.navbar-nav .nav-link:hover {
			color: #ffffff !important;
			transform: translateY(-3px);
		}
		.navbar-nav .nav-link.active {
			color: #5383e8 !important;
		}
		@keyframes pageSlideIn {
			from { opacity: 0; transform: translateY(18px); }
			to { opacity: 1; transform: translateY(0); }
		}
		body { animation: pageSlideIn 0.5s ease both; }
		body.page-exit { opacity: 0; transform: translateY(-10px); transition: opacity 0.3s ease, transform 0.3s ease; }
	</style>
</head>
<body>
	<!-- Navbar — same as all other pages, no link is "active" here -->
	<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
		<div class="container py-2">
			<a class="navbar-brand fw-bold" href="index.html">🛡️ Backlog Hero</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto text-uppercase small fw-bold">
					<li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
					<li class="nav-item"><a class="nav-link" href="library.html">My Library</a></li>
					<li class="nav-item"><a class="nav-link" href="search.html">Search Games</a></li>
					<li class="nav-item"><a class="nav-link" href="stats.html">Community</a></li>
					<li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
					<li class="nav-item"><a class="nav-link btn btn-outline-primary ms-lg-2 px-3 py-1" href="login.html">Login</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="auth-wrapper">
		<div class="container">
			<div class="row justify-content-center">
				<!-- Registration card — wider than login (col-lg-6) to fit the 2-column form layout.
				     The "Free" badge is just a visual touch -->
				<div class="col-md-8 col-lg-6">
					<div class="auth-card p-4 p-md-5">
						<div class="d-flex align-items-start justify-content-between mb-4">
							<div>
								<p class="text-uppercase text-muted small mb-1">Create your space</p>
								<h3 class="fw-bold mb-1">Join Backlog Hero</h3>
								<p class="text-muted small mb-0">Track, prioritize, and finish your games.</p>
							</div>
								<span class="badge badge-accent rounded-pill px-3 py-2">Free</span>
						</div>

						<!-- Registration form — connects to backend API.
						     2-column grid layout for better UX -->
						<form id="registerForm">
							<div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
							<div id="successAlert" class="alert alert-success d-none" role="alert"></div>

							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label">Username</label>
									<input type="text" class="form-control" id="username" placeholder="gaminglead" required>
									<small class="text-muted">3+ characters, letters/numbers only</small>
								</div>
								<div class="col-md-6">
									<label class="form-label">Email</label>
									<input type="email" class="form-control" id="email" placeholder="you@example.com" required>
								</div>
								<div class="col-md-6">
									<label class="form-label">Password</label>
									<input id="password" type="password" class="form-control" placeholder="Create a strong password" required>
									<div class="strength-bar mt-2"><div id="strengthFill" class="strength-fill"></div></div>
									<small class="text-muted">Use 10+ characters with numbers and symbols.</small>
								</div>
								<div class="col-md-6">
									<label class="form-label">Confirm Password</label>
									<input id="confirm" type="password" class="form-control" placeholder="Repeat password" required>
								</div>
								<div class="col-md-12">
									<label class="form-label">Display Name (Optional)</label>
									<input type="text" class="form-control" id="displayName" placeholder="Your Full Name">
								</div>
							</div>

							<!-- Terms checkbox — required before submitting -->
							<div class="form-check mt-4 mb-3">
								<input class="form-check-input" type="checkbox" value="" id="terms" required>
								<label class="form-check-label text-muted" for="terms">I agree to the Backlog Hero terms and privacy.</label>
							</div>

							<div class="d-grid mb-3">
								<button type="submit" class="btn btn-primary py-2" id="registerBtn">Create Account</button>
							</div>
							<p class="text-center text-muted mb-0">Already have an account? <a class="link-accent" href="login.html">Log in</a></p>
						</form>
					</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Password validation and registration API script -->
	<script>
		// Get references to form elements
		const passwordInput = document.getElementById('password');
		const confirmInput = document.getElementById('confirm');
		const strengthFill = document.getElementById('strengthFill');
		const registerForm = document.getElementById('registerForm');

		// Function to calculate password strength based on criteria
		function updateStrength(value) {
			let score = 0;
			if (value.length >= 10) score += 25;
			if (/[A-Z]/.test(value)) score += 25;
			if (/[0-9]/.test(value)) score += 25;
			if (/[^A-Za-z0-9]/.test(value)) score += 25;
			strengthFill.style.width = `${score}%`;
		}

		// Update strength meter in real-time
		if (passwordInput) {
			passwordInput.addEventListener('input', (e) => updateStrength(e.target.value));
		}

		// Password confirmation validation
		if (confirmInput && passwordInput) {
			confirmInput.addEventListener('input', () => {
				const match = confirmInput.value === passwordInput.value;
				confirmInput.classList.toggle('is-valid', match && confirmInput.value.length > 0);
				confirmInput.classList.toggle('is-invalid', !match && confirmInput.value.length > 0);
			});
		}

		// Register form submission to backend
		if (registerForm) {
			registerForm.addEventListener('submit', async (e) => {
				e.preventDefault();

				const username = document.getElementById('username').value;
				const email = document.getElementById('email').value;
				const password = document.getElementById('password').value;
				const confirm = document.getElementById('confirm').value;
				const displayName = document.getElementById('displayName').value || username;
				const registerBtn = document.getElementById('registerBtn');
				const errorAlert = document.getElementById('errorAlert');
				const successAlert = document.getElementById('successAlert');

				// Reset alerts
				errorAlert.classList.add('d-none');
				successAlert.classList.add('d-none');

				// Validate password match
				if (password !== confirm) {
					errorAlert.textContent = '✗ Passwords do not match';
					errorAlert.classList.remove('d-none');
					return;
				}

				// Disable button during submission
				registerBtn.disabled = true;
				registerBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Creating account...';

				try {
					const response = await fetch('/api/users/register', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						credentials: 'include',
						body: JSON.stringify({ username, email, password, displayName })
					});

					const data = await response.json();

					if (!response.ok) {
						throw new Error(data.error || 'Registration failed');
					}

					// Show success message
					successAlert.innerHTML = '✓ Account created! Redirecting to dashboard...';
					successAlert.classList.remove('d-none');

					// Redirect to dashboard
					setTimeout(() => {
						window.location.href = 'dashboard.html';
					}, 1500);

				} catch (err) {
					errorAlert.textContent = '✗ ' + err.message;
					errorAlert.classList.remove('d-none');
					registerBtn.disabled = false;
					registerBtn.innerHTML = 'Create Account';
				}
			});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Page transition animation
		document.querySelectorAll('a[href]').forEach(a => {
			if (a.hostname === location.hostname && !a.hash && !a.getAttribute('href').startsWith('#') && a.target !== '_blank') {
				a.addEventListener('click', e => {
					e.preventDefault();
					const dest = a.href;
					document.body.classList.add('page-exit');
					setTimeout(() => window.location = dest, 300);
				});
			}
		});
	</script>
</body>
</html>
