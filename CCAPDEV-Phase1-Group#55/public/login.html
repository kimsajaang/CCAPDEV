<!-- login.html — Login page for Backlog Hero.
     Centered auth card layout, matches the register page style.
     Only Steam and Google SSO for now — might add more later. -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Backlog Hero | Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<style>
		/* Login page dark theme with subtle radial gradient bg.
		   Same gradient as register page for visual consistency */
		html { overflow-y: scroll; }
		body {
			min-height: 100vh;
			background: radial-gradient(circle at 20% 20%, rgba(83, 131, 232, 0.18), transparent 25%),
						radial-gradient(circle at 80% 0%, rgba(80, 214, 180, 0.14), transparent 22%),
						#0f1519;
			color: #ffffff;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		.navbar {
			background-color: rgba(28, 37, 46, 0.9) !important;
			border-bottom: 1px solid #2a3843;
			backdrop-filter: blur(10px);
		}
		.navbar-brand {
			font-weight: 700;
			letter-spacing: 0.02em;
		}
		.navbar-nav .nav-link {
			color: #9e9e9e !important;
			transition: color 0.2s ease, transform 0.2s ease;
			padding: 0.5rem 1rem !important;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.06em;
		}
		.navbar-nav .nav-link:hover {
			color: #ffffff !important;
			transform: translateY(-3px);
		}
		.navbar-nav .nav-link.active {
			color: #5383e8 !important;
		}
		@keyframes pageSlideIn {
			from { opacity: 0; transform: translateY(18px); }
			to { opacity: 1; transform: translateY(0); }
		}
		body { animation: pageSlideIn 0.5s ease both; }
		body.page-exit { opacity: 0; transform: translateY(-10px); transition: opacity 0.3s ease, transform 0.3s ease; }
		.auth-wrapper {
			min-height: calc(100vh - 72px);
			display: flex;
			align-items: center;
			justify-content: center;
		}
		/* Auth card — glassmorphism-ish card for the login form.
		   The 60px box-shadow gives it a nice floating effect */
		.auth-card {
			background: linear-gradient(145deg, rgba(28, 37, 46, 0.9), rgba(16, 22, 27, 0.95));
			border: 1px solid #2a3843;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
			border-radius: 18px;
		}
		.form-control, .form-select {
			background-color: #10171d !important;
			border: 1px solid #2a3843;
			color: #ffffff;
		}
		.form-control::placeholder {
			color: #6f7d8a;
		}
		.form-control:focus, .form-select:focus {
			box-shadow: 0 0 0 0.15rem rgba(83, 131, 232, 0.35);
			border-color: #5383e8;
			color: #ffffff;
			background-color: #10171d;
		}
		.form-control,
		.form-control:focus,
		.form-control:active {
			color: #ffffff !important;
		}
		.form-select {
			color: #ffffff !important;
		}
		.form-label {
			color: #cbd5df;
		}
		.btn-primary {
			background-color: #5383e8 !important;
			border-color: #5383e8 !important;
		}
		.btn-primary:hover {
			background-color: #3d6ad2 !important;
			border-color: #3d6ad2 !important;
		}
		.btn-outline-primary {
			color: #5383e8 !important;
			border-color: #5383e8 !important;
			transition: all 0.2s ease;
		}
		.btn-outline-primary:hover {
			background-color: #5383e8 !important;
			color: #ffffff !important;
		}
		/* Override so the navbar Login button doesn't have a filled background
		   when we're already on the login page — looks cleaner this way */
		.navbar .btn-outline-primary,
		.navbar .btn-outline-primary.active {
			background-color: transparent !important;
		}
		.text-muted { color: #9e9e9e !important; }
		.link-accent { color: #7cb7ff; text-decoration: none; }
		.link-accent:hover { color: #a8ccff; }
		.badge-accent {
			background: transparent;
			border: 1px solid #50d6b4;
			color: #9ee8d8;
		}
		.provider-btn img,
		.provider-btn svg {
			width: 24px;
			height: 24px;
			flex-shrink: 0;
		}
		.provider-btn span {
			flex: 1;
			text-align: center;
		}
		/* Password toggle button styling */
		.password-toggle-btn {
			background-color: transparent;
			border: 1px solid #2a3843;
			color: #5383e8;
			padding: 0.375rem 0.75rem;
			transition: all 0.2s ease;
			font-size: 0.9rem;
			cursor: pointer;
		}
		.password-toggle-btn:hover {
			background-color: rgba(83, 131, 232, 0.1);
			border-color: #5383e8;
			color: #5383e8;
		}
		.password-toggle-btn:active {
			transform: scale(0.95);
		}
	</style>
</head>
<body>
	<!-- Navbar — Login button is active on this page -->
	<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
		<div class="container py-2">
			<a class="navbar-brand fw-bold" href="index.html">🛡️ Backlog Hero</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto text-uppercase small fw-bold">
					<li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
					<li class="nav-item"><a class="nav-link" href="library.html">My Library</a></li>
					<li class="nav-item"><a class="nav-link" href="search.html">Search Games</a></li>
					<li class="nav-item"><a class="nav-link" href="stats.html">Community</a></li>
					<li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
					<li class="nav-item"><a class="nav-link btn btn-outline-primary ms-lg-2 px-3 py-1 active" href="login.html">Login</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="auth-wrapper">
		<div class="container">
			<div class="row justify-content-center">
				<!-- Login form card — col-lg-5 keeps it narrow and centered.
				     p-md-5 adds extra padding on desktop for breathing room -->
				<div class="col-md-7 col-lg-5">
					<div class="auth-card p-4 p-md-5">
						<div class="d-flex align-items-start justify-content-between mb-4">
							<div>
								<p class="text-uppercase text-muted small mb-1">Welcome back</p>
								<h3 class="fw-bold mb-1">Log in to your backlog</h3>
								<p class="text-muted small mb-0">Stay on top of your gaming goals.</p>
							</div>
						</div>

						<!-- Login form — email/password + SSO providers.
						     Connects to backend API for authentication -->
						<form id="loginForm">
							<div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
							<div id="successAlert" class="alert alert-success d-none" role="alert"></div>
							
							<div class="mb-3">
								<label class="form-label">Email or Username</label>
								<input type="text" class="form-control" id="username" placeholder="username or email" required>
							</div>
							<div class="mb-3">
								<div class="d-flex justify-content-between align-items-center">
									<label class="form-label mb-0">Password</label>
									<a href="#" class="link-accent small">Forgot?</a>
								</div>
								<div class="input-group">
									<input id="password" type="password" class="form-control" placeholder="••••••••" required>
									<button class="password-toggle-btn" type="button" id="togglePassword" title="Show/Hide password">
										<i class="bi bi-eye-slash" id="toggleIcon"></i>
									</button>
								</div>
							</div>
							<div class="d-flex align-items-center justify-content-between mb-4">
								<div class="form-check">
									<input class="form-check-input" type="checkbox" value="" id="remember">
									<label class="form-check-label text-muted" for="remember">Keep me signed in</label>
								</div>
								<span class="text-muted small">Secure login</span>
							</div>
							<div class="d-grid mb-3">
								<button type="submit" class="btn btn-primary py-2" id="loginBtn">Log In</button>
							</div>							<!-- SSO provider buttons — Steam and Google -->
							<div class="d-grid mb-3">
								<button type="button" class="btn btn-outline-light border-secondary py-2 provider-btn d-flex align-items-center gap-2">
									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 259" fill="none"><path d="M127.779 0C60.42 0 5.24 52.412 0 119.014l68.724 28.674a35.872 35.872 0 0 1 20.426-6.366l30.64-44.74v-.627c0-26.903 21.69-48.795 48.345-48.795 26.655 0 48.345 21.892 48.345 48.795 0 26.903-21.69 48.795-48.345 48.795h-1.13l-43.68 31.413c0 .418-.04.837-.04 1.255 0 20.178-16.268 36.59-36.263 36.59-17.702 0-32.434-12.738-35.558-29.57L4.93 162.96C22.612 217.266 70.946 258.107 128.736 258.107c70.96 0 128.488-57.93 128.488-129.382C257.224 57.321 199.696 0 128.736 0z" fill="#ffffff"/><path d="M81.218 191.398l-15.612-6.508c5.558 11.56 17.295 19.583 30.908 19.583 18.825 0 34.106-15.422 34.106-34.422 0-18.998-15.281-34.421-34.106-34.421-6.507 0-12.573 1.88-17.736 5.056l16.14 6.729c12.28 5.118 18.109 19.14 13.026 31.323-5.082 12.182-19.002 17.977-31.282 12.86z" fill="#ffffff" opacity="0.8"/><path d="M200.186 144.755c0-17.895-14.432-32.463-32.233-32.463-17.8 0-32.233 14.568-32.233 32.463 0 17.894 14.432 32.463 32.233 32.463 17.8 0 32.233-14.569 32.233-32.463zm-56.085.07c0-13.268 10.666-24.034 23.852-24.034 13.186 0 23.852 10.766 23.852 24.034 0 13.267-10.666 24.032-23.852 24.032-13.186 0-23.852-10.765-23.852-24.032z" fill="#ffffff" opacity="0.8"/></svg>
									<span>Continue with Steam</span>
								</button>
								<button type="button" class="btn btn-outline-light border-secondary py-2 provider-btn d-flex align-items-center gap-2 mt-2">
									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
									<span>Continue with Google</span>
								</button>
							</div>
						</form>

						<p class="text-center text-muted mb-0">New to Backlog Hero? <a class="link-accent" href="register.html">Create an account</a></p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Login form and API handling scripts -->
	<script>
		// Password show/hide toggle
		const togglePassword = document.getElementById('togglePassword');
		const passwordInput = document.getElementById('password');
		const toggleIcon = document.getElementById('toggleIcon');
		if (togglePassword && passwordInput) {
			togglePassword.addEventListener('click', (e) => {
				e.preventDefault();
				const isHidden = passwordInput.type === 'password';
				passwordInput.type = isHidden ? 'text' : 'password';
				toggleIcon.className = isHidden ? 'bi bi-eye' : 'bi bi-eye-slash';
			});
		}

		// Login form submission
		const loginForm = document.getElementById('loginForm');
		if (loginForm) {
			loginForm.addEventListener('submit', async (e) => {
				e.preventDefault();
				
				const username = document.getElementById('username').value;
				const password = document.getElementById('password').value;
				const loginBtn = document.getElementById('loginBtn');
				const errorAlert = document.getElementById('errorAlert');
				const successAlert = document.getElementById('successAlert');

				// Reset alerts
				errorAlert.classList.add('d-none');
				successAlert.classList.add('d-none');

				// Disable button during submission
				loginBtn.disabled = true;
				loginBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Logging in...';

				try {
					const response = await fetch('/api/users/login', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						credentials: 'include',
						body: JSON.stringify({ username, password })
					});

					const data = await response.json();

					if (!response.ok) {
						throw new Error(data.error || 'Login failed');
					}

					// Show success message
					successAlert.textContent = '✓ Login successful! Redirecting...';
					successAlert.classList.remove('d-none');

					// Redirect after a short delay
					setTimeout(() => {
						window.location.href = 'dashboard.html';
					}, 1500);

				} catch (err) {
					errorAlert.textContent = '✗ ' + err.message;
					errorAlert.classList.remove('d-none');
					loginBtn.disabled = false;
					loginBtn.innerHTML = 'Log In';
				}
			});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Page transition animation
		document.querySelectorAll('a[href]').forEach(a => {
			if (a.hostname === location.hostname && !a.hash && !a.getAttribute('href').startsWith('#') && a.target !== '_blank') {
				a.addEventListener('click', e => {
					e.preventDefault();
					const dest = a.href;
					document.body.classList.add('page-exit');
					setTimeout(() => window.location = dest, 300);
				});
			}
		});
	</script>
</body>
</html>
