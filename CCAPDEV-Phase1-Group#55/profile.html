<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Backlog Hero | Profile</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			min-height: 100vh;
			background: radial-gradient(circle at 20% 20%, rgba(83, 131, 232, 0.18), transparent 25%),
						radial-gradient(circle at 80% 0%, rgba(80, 214, 180, 0.14), transparent 22%),
						#0f1519;
			color: #ffffff;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		.navbar {
			background-color: rgba(28, 37, 46, 0.9) !important;
			border-bottom: 1px solid #2a3843;
			backdrop-filter: blur(10px);
		}
		.profile-card {
			background: linear-gradient(145deg, rgba(28, 37, 46, 0.9), rgba(16, 22, 27, 0.95));
			border: 1px solid #2a3843;
			border-radius: 18px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
		}
		.badge-accent {
			background: linear-gradient(120deg, #50d6b4, #5383e8);
			color: #0d1217;
		}
		.stat-box {
			background-color: #10171d;
			border: 1px solid #2a3843;
			border-radius: 14px;
			padding: 1rem;
			text-align: center;
		}
		.stat-box h4 {
			margin: 0;
			font-weight: bold;
		}
		.stat-box span {
			color: #9e9e9e;
			font-size: 0.85rem;
		}
		.form-control, .form-select {
			background-color: #10171d !important;
			border: 1px solid #2a3843;
			color: #ffffff;
		}
		.form-control:focus, .form-select:focus {
			box-shadow: 0 0 0 0.15rem rgba(83, 131, 232, 0.35);
			border-color: #5383e8;
		}
		.btn-primary {
			background-color: #5383e8 !important;
			border-color: #5383e8 !important;
		}
		.btn-outline-secondary {
			border-color: #2a3843;
			color: #ffffff;
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
		<div class="container py-2">
			<a class="navbar-brand fw-bold" href="index.html">🛡️ Backlog Hero</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
					<li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
					<li class="nav-item"><a class="nav-link" href="library.html">My Library</a></li>
					<li class="nav-item"><a class="nav-link" href="search.html">Search Games</a></li>
					<li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
					<li class="nav-item"><span class="badge badge-accent ms-lg-2">Online</span></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container my-5">
		<div class="row g-4">
			<div class="col-lg-4">
				<div class="profile-card p-4">
					<div class="text-center mb-3">
						<img src="assets/avatar-placeholder.png" class="rounded-circle mb-3" width="110" height="110" alt="Avatar">
						<h4 class="fw-bold mb-0">PlayerOne</h4>
						<p class="text-muted mb-1">Casual Gamer</p>
						<span class="badge badge-accent">Backlog Hero</span>
					</div>
					<hr class="border-secondary">
					<div class="row g-3">
						<div class="col-4">
							<div class="stat-box">
								<h4>128</h4>
								<span>Games</span>
							</div>
						</div>
						<div class="col-4">
							<div class="stat-box">
								<h4>42</h4>
								<span>Completed</span>
							</div>
						</div>
						<div class="col-4">
							<div class="stat-box">
								<h4>7</h4>
								<span>Streak</span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-lg-8">
				<div class="profile-card p-4 mb-4">
					<h5 class="fw-bold mb-3">Profile Settings</h5>
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Display Name</label>
							<input type="text" class="form-control" value="PlayerOne">
						</div>
						<div class="col-md-6">
							<label class="form-label">Gaming Identity</label>
							<select class="form-select">
								<option selected>Casual</option>
								<option>Completionist</option>
								<option>Speedrunner</option>
							</select>
						</div>
						<div class="col-12">
							<label class="form-label">Bio</label>
							<textarea class="form-control" rows="3" placeholder="Tell us about your gaming habits..."></textarea>
						</div>
					</div>
					<div class="d-flex justify-content-end mt-4">
						<button class="btn btn-primary px-4">Save Changes</button>
					</div>
				</div>

				<div class="profile-card p-4">
					<h5 class="fw-bold mb-3">Achievements</h5>
					<div class="row g-3">
						<div class="col-md-4">
							<div class="stat-box">
								🏆<br><strong>First Finish</strong><br><span>Completed your first game</span>
							</div>
						</div>
						<div class="col-md-4">
							<div class="stat-box">
								🔥<br><strong>7-Day Streak</strong><br><span>Played every day</span>
							</div>
						</div>
						<div class="col-md-4">
							<div class="stat-box">
								📚<br><strong>Collector</strong><br><span>100+ games added</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
